name: saiv

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: saiv
      POSTGRES_USER: saiv
      POSTGRES_PASSWORD: ${DB_PASSWORD:-saiv}
      TZ: ${TZ:-America/Asuncion}
      PGTZ: ${TZ:-America/Asuncion}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saiv -d saiv"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Sin "ports": la base solo es accesible dentro de la red de Docker.

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/saiv
      DB_USER: saiv
      DB_PASSWORD: ${DB_PASSWORD:-saiv}
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-por-uno-largo-de-al-menos-32-bytes!!}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      TZ: ${TZ:-America/Asuncion}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"

volumes:
  pgdata:
